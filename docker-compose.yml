services:

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-asignar_citas}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-123}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1
  back:
    build: ./back
    image: citas-back:latest
    container_name: citas-back
    restart: always
    ports:
      - "${BACK_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      PORT: 3000
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
  front:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    image: citas-front:latest
    container_name: citas-front
    ports:
      - "${FRONT_PORT:-5173}:80"
    restart: unless-stopped
    depends_on:
      - back
  
  

volumes:
  db_data: